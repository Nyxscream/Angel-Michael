kind = "mobile"
previewPath = "/angel-michael/"
title = "Angel Michael"
description = "A human-controlled mobile dashboard for Angel Michael, an AI safety guardian that reviews Watchtower incidents, prepares plain-language daily safety talks, and lets overseers copy them for WhatsApp sharing."
version = "1.0.0"
id = "artifacts/angel-michael"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/angel-michael/" ]
localPort = 23625

[services.development]
run = "pnpm --filter @workspace/angel-michael run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/angel-michael", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/angel-michael", "run", "serve" ]

[services.env]
PORT = "23625"
BASE_PATH = "/angel-michael/"
